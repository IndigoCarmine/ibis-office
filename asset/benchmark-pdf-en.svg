<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 725" width="100%" height="auto">
  <defs>
    <style>
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Hiragino Sans", "Noto Sans JP", sans-serif;
      }
      .title-text {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .subtitle-text {
        font-size: 13px;
        font-weight: 500;
      }
      .indicator-text {
        font-size: 12px;
        font-weight: 600;
      }
      .group-title-text {
        font-size: 14px;
        font-weight: 700;
      }
      .group-meta-text {
        font-size: 12px;
        font-weight: 400;
      }
      .killer-badge-text {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }
      .label-highlight {
        font-size: 13px;
        font-weight: 800;
      }
      .label-normal {
        font-size: 13px;
        font-weight: 600;
      }
      .time-highlight {
        font-size: 13.5px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .time-normal {
        font-size: 13px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .ratio-text {
        font-size: 11.5px;
        font-weight: 500;
      }
      .footer-env-text {
        font-size: 11.5px;
        font-weight: 500;
      }
      .brand-text {
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }
    </style>
    <linearGradient id="ibisGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background Card (No Drop Shadow) -->
  <rect x="0.5" y="0.5" width="959" height="724" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />

  <!-- Header -->
  <g class="font-sans">
    <!-- Title & Subtitle -->
    <text x="30" y="54" fill="#0F172A" class="title-text">PDF Export Speed Benchmark</text>
    <text x="30" y="78" fill="#475569" class="subtitle-text">Command-line conversion time until PDF is completely written</text>

    <!-- Indicator Pill (Right) -->
    <rect x="804" y="38" width="126" height="28" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="818" cy="52" r="3.5" fill="#0284C7" />
    <text x="828" y="56" fill="#0284C7" class="indicator-text">Shorter is faster</text>

    <!-- Divider -->
    <line x1="30" y1="98" x2="930" y2="98" stroke="#F1F5F9" stroke-width="1" />
  </g>

  <!-- Sections -->
  
  <!-- Section: Presentation (.pptx) -->
  <g class="font-sans">
    <rect x="30" y="114" width="900" height="172" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    
    <!-- Icon -->
    <rect x="46" y="128" width="22" height="22" rx="5" fill="#EA580C" />
    <text x="57" y="144" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="800">P</text>
    
    <!-- Title & Meta -->
    <text x="76" y="144" fill="#1E293B" class="group-title-text">Presentation (.pptx) <tspan fill="#64748B" class="group-meta-text">— 31 slides, 35.9 MB</tspan></text>
    
    <!-- Killer Badge (Range format) -->
    <rect x="755" y="127" width="159" height="24" rx="6" fill="url(#badgeGrad)" />
    <text x="834" y="143" text-anchor="middle" fill="#FFFFFF" class="killer-badge-text">⚡ 4.1x - 22.8x FASTER</text>
    
    <!-- Rows -->
    
            <text x="46" y="178" fill="#0284C7" class="label-highlight">★ <tspan fill="#0F172A">ibisOffice</tspan></text>
            
            <rect x="186" y="164" width="21.1" height="18" rx="5" fill="url(#ibisGrad)" />
            
            <text x="217.1" y="178" fill="#0284C7" class="time-highlight">1.42 s</text>
            
            <text x="46" y="206" fill="#475569" class="label-normal">ONLYOFFICE</text>
            
            <rect x="186" y="192" width="87.3" height="18" rx="5" fill="#CBD5E1" />
            
            <text x="283.3" y="206" fill="#475569" class="time-normal">5.87 s<tspan fill="#64748B" class="ratio-text"> (4.1×)</tspan></text>
            
            <text x="46" y="234" fill="#475569" class="label-normal">Microsoft Office</text>
            
            <rect x="186" y="220" width="125.0" height="18" rx="5" fill="#CBD5E1" />
            
            <text x="321.0" y="234" fill="#475569" class="time-normal">8.40 s<tspan fill="#64748B" class="ratio-text"> (5.9×)</tspan></text>
            
            <text x="46" y="262" fill="#475569" class="label-normal">LibreOffice</text>
            
            <rect x="186" y="248" width="480.0" height="18" rx="5" fill="#CBD5E1" />
            
            <text x="676.0" y="262" fill="#475569" class="time-normal">32.26 s<tspan fill="#64748B" class="ratio-text"> (22.8×)</tspan></text>
            
  </g>
  
  <!-- Section: Document (.docx) -->
  <g class="font-sans">
    <rect x="30" y="298" width="900" height="172" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    
    <!-- Icon -->
    <rect x="46" y="312" width="22" height="22" rx="5" fill="#2563EB" />
    <text x="57" y="328" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="800">W</text>
    
    <!-- Title & Meta -->
    <text x="76" y="328" fill="#1E293B" class="group-title-text">Document (.docx) <tspan fill="#64748B" class="group-meta-text">— 140–154 pages, 0.12 MB</tspan></text>
    
    <!-- Killer Badge (Range format) -->
    <rect x="755" y="311" width="159" height="24" rx="6" fill="url(#badgeGrad)" />
    <text x="834" y="327" text-anchor="middle" fill="#FFFFFF" class="killer-badge-text">⚡ 5.0x - 18.1x FASTER</text>
    
    <!-- Rows -->
    
            <text x="46" y="362" fill="#0284C7" class="label-highlight">★ <tspan fill="#0F172A">ibisOffice</tspan></text>
            
            <rect x="186" y="348" width="26.5" height="18" rx="5" fill="url(#ibisGrad)" />
            
            <text x="222.5" y="362" fill="#0284C7" class="time-highlight">0.69 s</text>
            
            <text x="46" y="390" fill="#475569" class="label-normal">LibreOffice</text>
            
            <rect x="186" y="376" width="132.6" height="18" rx="5" fill="#CBD5E1" />
            
            <text x="328.6" y="390" fill="#475569" class="time-normal">3.45 s<tspan fill="#64748B" class="ratio-text"> (5.0×)</tspan></text>
            
            <text x="46" y="418" fill="#475569" class="label-normal">ONLYOFFICE</text>
            
            <rect x="186" y="404" width="161.0" height="18" rx="5" fill="#CBD5E1" />
            
            <text x="357.0" y="418" fill="#475569" class="time-normal">4.19 s<tspan fill="#64748B" class="ratio-text"> (6.1×)</tspan></text>
            
            <text x="46" y="446" fill="#475569" class="label-normal">Microsoft Office</text>
            
            <rect x="186" y="432" width="480.0" height="18" rx="5" fill="#CBD5E1" />
            
            <text x="676.0" y="446" fill="#475569" class="time-normal">12.49 s<tspan fill="#64748B" class="ratio-text"> (18.1×)</tspan></text>
            
  </g>
  
  <!-- Section: Spreadsheet (.xlsx) -->
  <g class="font-sans">
    <rect x="30" y="482" width="900" height="172" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    
    <!-- Icon -->
    <rect x="46" y="496" width="22" height="22" rx="5" fill="#16A34A" />
    <text x="57" y="512" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="800">X</text>
    
    <!-- Title & Meta -->
    <text x="76" y="512" fill="#1E293B" class="group-title-text">Spreadsheet (.xlsx) <tspan fill="#64748B" class="group-meta-text">— 22 sheets, 29 charts, 589K formulas, 13.7 MB</tspan></text>
    
    <!-- Killer Badge (Range format) -->
    <rect x="761" y="495" width="153" height="24" rx="6" fill="url(#badgeGrad)" />
    <text x="837" y="511" text-anchor="middle" fill="#FFFFFF" class="killer-badge-text">⚡ 2.7x - 5.9x FASTER</text>
    
    <!-- Rows -->
    
            <text x="46" y="546" fill="#0284C7" class="label-highlight">★ <tspan fill="#0F172A">ibisOffice</tspan></text>
            
            <rect x="186" y="532" width="81.2" height="18" rx="5" fill="url(#ibisGrad)" />
            
            <text x="277.2" y="546" fill="#0284C7" class="time-highlight">7.26 s</text>
            
            <text x="46" y="574" fill="#475569" class="label-normal">LibreOffice</text>
            
            <rect x="186" y="560" width="217.5" height="18" rx="5" fill="#CBD5E1" />
            
            <text x="413.5" y="574" fill="#475569" class="time-normal">19.46 s<tspan fill="#64748B" class="ratio-text"> (2.7×)</tspan></text>
            
            <text x="46" y="602" fill="#475569" class="label-normal">ONLYOFFICE</text>
            
            <rect x="186" y="588" width="278.2" height="18" rx="5" fill="#CBD5E1" />
            
            <text x="474.2" y="602" fill="#475569" class="time-normal">24.89 s<tspan fill="#64748B" class="ratio-text"> (3.4×)</tspan></text>
            
            <text x="46" y="630" fill="#475569" class="label-normal">Microsoft Office</text>
            
            <rect x="186" y="616" width="480.0" height="18" rx="5" fill="#CBD5E1" />
            
            <text x="676.0" y="630" fill="#475569" class="time-normal">42.94 s<tspan fill="#64748B" class="ratio-text"> (5.9×)</tspan></text>
            
  </g>
  

  <!-- Footer -->
  <g class="font-sans">
    <line x1="30" y1="670" x2="930" y2="670" stroke="#F1F5F9" stroke-width="1" />
    <text x="30" y="700" fill="#64748B" class="footer-env-text">Apple M2 Pro (16 GB), macOS 26.5.1  •  ibisOffice 0.1.0 vs Microsoft Office 16.113 vs LibreOffice 26.8 vs ONLYOFFICE 9.4</text>
    
    <circle cx="856" cy="696" r="3.5" fill="#0284C7" />
    <text x="866" y="700" fill="#0284C7" class="brand-text">ibisOffice</text>
  </g>
</svg>
