<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 395" width="100%" height="auto">
  <defs>
    <style>
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Hiragino Sans", "Noto Sans JP", sans-serif;
      }
      .title-text {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .subtitle-text {
        font-size: 13px;
        font-weight: 500;
      }
      .indicator-text {
        font-size: 12px;
        font-weight: 600;
      }
      .group-title-text {
        font-size: 14px;
        font-weight: 700;
      }
      .group-meta-text {
        font-size: 12px;
        font-weight: 400;
      }
      .killer-badge-text {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }
      .label-highlight {
        font-size: 13px;
        font-weight: 800;
      }
      .label-normal {
        font-size: 13px;
        font-weight: 600;
      }
      .time-highlight {
        font-size: 13.5px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .time-normal {
        font-size: 13px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .ratio-text {
        font-size: 11.5px;
        font-weight: 500;
      }
      .bar-warning-text {
        font-size: 11px;
        font-weight: 700;
      }
      .footer-env-text {
        font-size: 11.5px;
        font-weight: 500;
      }
      .brand-text {
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }
    </style>
    <linearGradient id="ibisGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="0.5" y="0.5" width="959" height="394" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />

  <!-- Header -->
  <g class="font-sans">
    <text x="30" y="54" fill="#0F172A" class="title-text">1,000,000-Row CSV First View Speed Benchmark</text>
    <text x="30" y="78" fill="#475569" class="subtitle-text">Time from open request until first screen is rendered for immediate viewing (app already running)</text>

    <!-- Indicator Pill -->
    <rect x="804" y="38" width="126" height="28" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="818" cy="52" r="3.5" fill="#0284C7" />
    <text x="828" y="56" fill="#0284C7" class="indicator-text">Shorter is faster</text>

    <line x1="30" y1="98" x2="930" y2="98" stroke="#F1F5F9" stroke-width="1" />
  </g>

  <!-- Section: 1,000,000-row CSV -->
  <g class="font-sans">
    <rect x="30" y="114" width="900" height="172" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    
    <!-- Icon -->
    <rect x="46" y="128" width="22" height="22" rx="5" fill="#0D9488" />
    <text x="57" y="144" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="800">C</text>
    
    <!-- Title & Meta -->
    <text x="76" y="144" fill="#1E293B" class="group-title-text">Large Spreadsheet (.csv) <tspan fill="#64748B" class="group-meta-text">— 1,048,576 rows, 20 columns, 116 MB (First View)</tspan></text>
    
    <!-- Killer Badge -->
    <rect x="748" y="127" width="166" height="24" rx="6" fill="url(#badgeGrad)" />
    <text x="831" y="143" text-anchor="middle" fill="#FFFFFF" class="killer-badge-text">⚡ 14.5x - 176x FASTER</text>
    
    <!-- Rows -->
    <!-- ibisOffice -->
    <text x="46" y="178" fill="#0284C7" class="label-highlight">★ <tspan fill="#0F172A">ibisOffice</tspan></text>
    <rect x="186" y="164" width="20.0" height="18" rx="5" fill="url(#ibisGrad)" />
    <text x="216.0" y="178" fill="#0284C7" class="time-highlight">0.78 s</text>
    
    <!-- LibreOffice -->
    <text x="46" y="206" fill="#475569" class="label-normal">LibreOffice</text>
    <rect x="186" y="192" width="39.5" height="18" rx="5" fill="#CBD5E1" />
    <text x="235.5" y="206" fill="#475569" class="time-normal">11.30 s<tspan fill="#64748B" class="ratio-text"> (14.5×)</tspan></text>
    
    <!-- Microsoft Excel -->
    <text x="46" y="234" fill="#475569" class="label-normal">Microsoft Excel</text>
    <rect x="186" y="220" width="66.5" height="18" rx="5" fill="#CBD5E1" />
    <text x="262.5" y="234" fill="#475569" class="time-normal">19.04 s<tspan fill="#64748B" class="ratio-text"> (24.4×)</tspan></text>
    
    <!-- ONLYOFFICE -->
    <text x="46" y="262" fill="#475569" class="label-normal">ONLYOFFICE</text>
    <rect x="186" y="248" width="480.0" height="18" rx="5" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1" />
    <text x="200" y="261" fill="#DC2626" class="bar-warning-text">Failed to open</text>
    <text x="676.0" y="262" fill="#475569" class="time-normal">137.3 s*<tspan fill="#64748B" class="ratio-text"> (176.0×)</tspan></text>
  </g>

  <!-- Footer -->
  <g class="font-sans">
    <line x1="30" y1="300" x2="930" y2="300" stroke="#F1F5F9" stroke-width="1" />
    <text x="30" y="328" fill="#64748B" class="footer-env-text">* ONLYOFFICE timed out on 1M rows (&gt;300 s); estimated at 3.3× its 300K-row load time (41.60 s)</text>
    <text x="30" y="356" fill="#64748B" class="footer-env-text">Apple M2 Pro (16 GB), macOS 26.5.1  •  ibisOffice ver.0.8.2 (100K progressive First View in 0.78 s, full rows in 4.44 s)</text>
    <circle cx="856" cy="352" r="3.5" fill="#0284C7" />
    <text x="866" y="356" fill="#0284C7" class="brand-text">ibisOffice</text>
  </g>
</svg>
