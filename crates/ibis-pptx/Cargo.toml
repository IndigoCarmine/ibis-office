[package]
name = "ibis-pptx"
description = "Reads and saves PowerPoint (.pptx), Excel (.xlsx) and Word (.docx) files for ibisOffice."
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
ibis-calc.workspace = true
ibis-doc-model.workspace = true
ibis-ooxml.workspace = true
miniz_oxide = "0.8"
roxmltree = "0.21"
encoding_rs = "0.8"

[[bin]]
name = "ibis-office-roundtrip"
path = "src/bin/roundtrip.rs"

[[bin]]
name = "ibis-office-geometry"
path = "src/bin/geometry.rs"

[[bin]]
name = "ibis-calc-check"
path = "src/bin/calc_check.rs"
