[package]
name = "ibis-ooxml"
description = "OOXML packages for ibisOffice: ZIP, a lossless read-write XML tree, parts and relationships, and comparing files by meaning."
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "ibis-ooxml-diff"
path = "src/bin/ooxml_diff.rs"

[dependencies]
miniz_oxide = "0.8"
# Password-protected files (MS-OFFCRYPTO Agile encryption): RustCrypto's AES,
# CBC, SHA-2 and HMAC (MIT OR Apache-2.0), the versions the workspace already has.
aes = "0.8"
cbc = "0.1"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"
