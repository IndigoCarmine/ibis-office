[package]
name = "ibis-embed-protocol"
description = "ibisOffice's side of the embedded (OLE) object protocol: acauda-embed, re-exported, and OLE objects to and from its messages."
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
acauda-embed = { git = "https://github.com/IndigoCarmine/acauda-embed", rev = "9b78881a2d703fe97483f64f0c99cb851226df80" }

# The host's side (ibisOffice): OLE objects to and from messages, previews
# drawn. Editors leave it off.
[features]
host = ["dep:ibis-ooxml", "dep:resvg"]

[dependencies.ibis-ooxml]
workspace = true
optional = true

# The version GPUI already has (MPL-2.0): SVG previews drawn to PNG for Office.
[dependencies.resvg]
version = "=0.46.0"
default-features = false
features = ["text", "system-fonts", "raster-images"]
optional = true

# End to end with a presentation (tests/presentation.rs): an object read,
# edited in the mock editor and saved.
[dev-dependencies]
ibis-doc-model.workspace = true
ibis-pptx.workspace = true
